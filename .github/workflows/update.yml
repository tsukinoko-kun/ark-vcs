name: Update

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: ./update.sh

      - name: Commit new version
        run: |
          git diff --quiet && exit 0
          version="$(grep -oE '^  version "[^"]+"' Formula/ark-vcs.rb | cut -d'"' -f2)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "ark-vcs $version"
          git push

      - name: Keep scheduled workflow from being disabled after 60 days of inactivity
        run: gh workflow enable update.yml
        env:
          GH_TOKEN: ${{ github.token }}
